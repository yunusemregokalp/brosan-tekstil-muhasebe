version: '3.8'

# ==============================================================================
# BROSAN TEKSTİL ERP — STANDART & YEREL DOCKER COMPOSE YAPILANDIRMASI
# ==============================================================================

services:
  # 1. PostgreSQL 16 İlişkisel Veritabanı
  postgres:
    image: postgres:16-alpine
    container_name: brosan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-BrosanTekstil2026SecurePass!}
      POSTGRES_DB: ${POSTGRES_DB:-brosan_accounting_db}
    ports:
      - "5432:5432"
    volumes:
      - brosan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-brosan_accounting_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - brosan_network

  # 2. Brosan ERP Node/Express Web & API Sunucusu
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brosan-accounting-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-BrosanTekstil2026SecurePass!}@postgres:5432/${POSTGRES_DB:-brosan_accounting_db}?schema=public"
      CORS_ORIGIN: "*"
      RUN_SEED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - brosan_network

volumes:
  brosan_postgres_data:
    name: brosan_postgres_data

networks:
  brosan_network:
    name: brosan_network
    driver: bridge
