version: '3.8'

# ==============================================================================
# BROSAN TEKSTİL ERP — COOLIFY BULUT DAĞITIM YAPILANDIRMASI
# ==============================================================================

services:
  # 1. PostgreSQL 16 Veritabanı (İzole, Dışarıya Kapalı)
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-BrosanTekstil2026SecurePass!}
      POSTGRES_DB: ${POSTGRES_DB:-brosan_accounting_db}
    volumes:
      - brosan_cloud_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-postgres} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      - "coolify.managed=true"

  # 2. Brosan ERP Node/Express Web & API Sunucusu
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-BrosanTekstil2026SecurePass!}@postgres:5432/${POSTGRES_DB:-brosan_accounting_db}?schema=public"
      CORS_ORIGIN: "*"
      RUN_SEED: ${RUN_SEED:-true}
    depends_on:
      - postgres
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.brosan-erp.rule=(Host(`brosangroup.com`) && PathPrefix(`/muhasebe`)) || Host(`muhasebe.brosangroup.com`)"
      - "traefik.http.routers.brosan-erp.entrypoints=http,https,web,websecure"
      - "traefik.http.routers.brosan-erp.tls=true"
      - "traefik.http.routers.brosan-erp-http.rule=(Host(`brosangroup.com`) && PathPrefix(`/muhasebe`)) || Host(`muhasebe.brosangroup.com`)"
      - "traefik.http.routers.brosan-erp-http.entrypoints=http,web"
      - "traefik.http.routers.brosan-erp-http.service=brosan-erp"
      - "traefik.http.services.brosan-erp.loadbalancer.server.port=3000"

volumes:
  brosan_cloud_pgdata:
    name: brosan_cloud_pgdata
