version: '3.8'

# ==============================================================================
# BROSAN TEKSTİL ERP — COOLIFY BULUT DAĞITIM YAPILANDIRMASI
# ==============================================================================

services:
  # 1. PostgreSQL 16 Veritabanı (İzole, Dışarıya Kapalı)
  postgres:
    image: postgres:16-alpine
    container_name: brosan-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-BrosanTekstil2026SecurePass!}
      POSTGRES_DB: ${POSTGRES_DB:-brosan_accounting_db}
    volumes:
      - brosan_cloud_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-brosan_accounting_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "coolify.managed=true"

  # 2. Brosan ERP Node/Express Web & API Sunucusu
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brosan-erp-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-BrosanTekstil2026SecurePass!}@postgres:5432/${POSTGRES_DB:-brosan_accounting_db}?schema=public"
      CORS_ORIGIN: "*"
      RUN_SEED: ${RUN_SEED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.brosan-erp.rule=Host(`${COOLIFY_FQDN:-173.249.23.10}`)"
      - "traefik.http.routers.brosan-erp.entrypoints=web"
      - "traefik.http.services.brosan-erp.loadbalancer.server.port=3000"

volumes:
  brosan_cloud_pgdata:
    name: brosan_cloud_pgdata
